[package]
name = "rssbot"
version = "2.0.0-alpha.18"
authors = ["iovxw <iovxw@outlook.com>"]
edition = "2024"

[features]
default = ["rustls"]

# enable this to set a subscription limit
hosted-by-iovxw = ["reqwest/hickory-dns"]
native-tls = ["teloxide/native-tls", "reqwest/native-tls-vendored"]
rustls = ["teloxide/rustls", "reqwest/rustls-tls"]

[build-dependencies]
ctl10n = "0.2.0"

[dependencies]
anyhow = "1.0"
structopt = "0.3"
url = "2"
futures = "0.3"
tokio = { version = "1.32", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
quick-xml = { version = "0.39", features = ["encoding", "escape-html"] }
chrono = "0.4"
pinyin = "0.11"
either = "1.9"
atomicwrites = "0.4"
log = "0.4"
env_logger = "0.11"

[dependencies.teloxide]
version = "0.17"
default-features = false
features = ["macros", "ctrlc_handler"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["gzip", "json"]
